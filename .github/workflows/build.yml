name: Build APK

on:
  push:
    branches: [ "**" ] # S'exécute sur absolument toutes les branches (main, bot, etc.)

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cette action officielle pré-installe tout et évite le crash du dossier python-for-android manquant
      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          buildozer_config: buildozer.spec
          command: android debug
          repository_cache: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
