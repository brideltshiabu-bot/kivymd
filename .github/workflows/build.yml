name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ÉTAPE 1 : Installer Java 17 obligatoire pour l'API Android 34
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ÉTAPE 2 : Utiliser l'Action officielle Buildozer (Gère les dépendances et le cache)
      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          # Utilise le fichier spec à la racine du projet
          buildozer_config: buildozer.spec
          # Commande de build standard brute
          command: android debug
          # Désactive le nettoyage automatique agressif qui fait planter l'environnement vierge
          repository_cache: true
